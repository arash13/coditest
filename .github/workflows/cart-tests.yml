name: Cart calculator tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node24:
    name: Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run built-in test suite
        run: npm test
